name: club-billing

# Settings shared by every container that runs our PHP code.
# Only the "app" service builds the image; the others reuse it (pull_policy: never).
x-app: &app
  image: club-billing-app:dev
  pull_policy: never
  environment:
    APP_ENV: development
    LOG_LEVEL: info
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: club_billing
    DB_USER: club_billing
    # The password itself is never in this file: it is mounted as a Docker secret
    # and the app reads it from this path (see src/Infrastructure/Config/Config.php).
    DB_PASSWORD_FILE: /run/secrets/db_password
    ACCESS_TOKEN_TTL_SECONDS: "3600"
    FAKE_GATEWAY_LATENCY_MS: "300"
    KAFKA_BROKERS: kafka:9092
    KAFKA_TOPIC: billing.payment-events
  secrets:
    - db_password

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: club_billing
      MARIADB_USER: club_billing
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    # Local inspection only (TablePlus, DBeaver, ...): bound to 127.0.0.1, so not reachable from the network.
    # Port 3307 avoids clashing with a MySQL already running on the Mac.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  # One-shot job: apply schema migrations, then load demo data. Exits when done.
  migrate:
    <<: *app
    command: ["sh", "-c", "php bin/migrate.php && php bin/seed.php"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # PHP-FPM running the API.
  app:
    <<: *app
    build:
      context: .
      target: dev
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Background worker: moves events from the outbox table to Kafka.
  outbox-relay:
    <<: *app
    command: ["php", "bin/outbox-relay.php"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  db-data:
