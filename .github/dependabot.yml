# Weekly pull requests for outdated dependencies. CI runs on each one, so an update that
# breaks something is caught before merge. Security updates arrive immediately, outside this schedule.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
