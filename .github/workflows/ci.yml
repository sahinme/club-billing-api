name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same command a developer runs locally: code style, PHPStan, PHPUnit against MariaDB,
      # composer audit (known vulnerabilities), and a production image build.
      - name: Run all checks
        run: make ci

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
