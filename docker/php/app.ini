; Applies to php-fpm and the CLI.

expose_php = Off

; Errors go to the log (container stderr), never into an HTTP response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Keep function arguments (which may contain passwords or tokens) out of stack traces.
zend.exception_ignore_args = On

date.timezone = UTC
memory_limit = 256M
