[global]
; Our JSON log lines can be longer than the 1024 byte default.
log_limit = 8192

[www]
; Pass container environment variables (DB_HOST, DB_PASSWORD_FILE, ...) through to PHP.
; php-fpm clears them by default.
clear_env = no

; nginx already writes an access log for every request.
access.log = /dev/null

; Forward what workers write to stderr (our logs) to the container output, unchanged.
catch_workers_output = yes
decorate_workers_output = no
