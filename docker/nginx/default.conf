server {
    listen 80;
    server_name _;
    server_tokens off;

    # Our requests are tiny JSON bodies. Reject anything big before it reaches PHP.
    client_max_body_size 16k;

    # Resolve "app" through Docker's DNS at request time, not once at startup,
    # so nginx keeps working when the app container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    # Every request goes to the single PHP entry point. No other PHP file is reachable from outside.
    location / {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
